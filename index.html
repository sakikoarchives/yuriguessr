<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Yuri Guessr</title>
  <style>
:root {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #f5f5f7;
  background: #101114;
  font-synthesis: none;
  --surface: #191b20;
  --surface-hover: #22252b;
  --line: #31343b;
  --muted: #9b9fa9;
  --good: #59c995;
  --bad: #e86d78;
}

* { box-sizing: border-box; }

html,
body {
  margin: 0;
  min-height: 100%;
  background: #101114;
}

body { min-height: 100vh; }
button, a { font: inherit; }
button { cursor: pointer; }

.game {
  width: min(780px, 100%);
  margin: 0 auto;
  padding: 10px;
}

.hud {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  min-height: 32px;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 0.84rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.hud span:nth-child(2) {
  color: #f5f5f7;
  font-size: 0.92rem;
}

.hud span:last-child { text-align: right; }

.artwork-frame {
  display: grid;
  place-items: center;
  width: 100%;
  height: min(62vh, 560px);
  min-height: 250px;
  overflow: hidden;
  border-radius: 8px;
  background: #08090b;
}

.artwork-frame img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.answers {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
  margin-top: 8px;
}

.answer,
.primary {
  border: 1px solid var(--line);
  border-radius: 7px;
  font-weight: 700;
}

.answer {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 47px;
  padding: 9px 34px 9px 12px;
  background: var(--surface);
  color: #f5f5f7;
  line-height: 1.15;
  transition: background 100ms ease, border-color 100ms ease, transform 80ms ease;
}

.answer:hover:not(:disabled) { background: var(--surface-hover); }
.answer:active:not(:disabled) { transform: scale(0.995); }
.answer:disabled { cursor: default; }

.answer-label {
  min-width: 0;
  max-width: 100%;
  overflow-wrap: anywhere;
}

.answer.long { font-size: 0.88rem; }
.answer.very-long { font-size: 0.76rem; }

.answer-key {
  position: absolute;
  right: 10px;
  color: #696e78;
  font-size: 0.72rem;
  font-weight: 800;
}

.answer.correct {
  border-color: var(--good);
  background: color-mix(in srgb, var(--good) 14%, var(--surface));
}

.answer.wrong {
  border-color: var(--bad);
  background: color-mix(in srgb, var(--bad) 14%, var(--surface));
}

.feedback {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  min-height: 38px;
  margin-top: 8px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--muted);
  font-size: 0.84rem;
}

.feedback-copy {
  min-width: 0;
  overflow-wrap: anywhere;
}

.feedback strong {
  color: #f5f5f7;
  margin-right: 6px;
}

.feedback a {
  flex: 0 0 auto;
  color: var(--muted);
  text-decoration: none;
}

.feedback a:hover { color: #fff; }

.primary {
  padding: 8px 13px;
  background: #f3f3f5;
  color: #111216;
}

.state-panel {
  min-height: min(76vh, 620px);
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 12px;
  padding: 24px;
  text-align: center;
  color: var(--muted);
}

.state-panel p {
  margin: 0;
  max-width: 540px;
  line-height: 1.5;
}

.spinner {
  width: 26px;
  height: 26px;
  border: 3px solid var(--line);
  border-top-color: #d9dbe1;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

.game-over {
  color: #fff;
  font-size: clamp(2.1rem, 9vw, 3.8rem);
  font-weight: 800;
  letter-spacing: -0.05em;
}

.final-stats {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.hidden { display: none !important; }

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 560px) {
  .game { padding: 7px; }
  .artwork-frame { height: 55vh; min-height: 220px; }
  .answers { grid-template-columns: 1fr; }
  .answer { min-height: 43px; }
  .feedback { align-items: flex-start; }
}

#errorText {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  user-select: text;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.75rem;
}
  </style>
</head>
<body>
  <main class="game">
    <header class="hud" aria-label="Game stats">
      <span id="roundLabel">Round —</span>
      <span id="scoreLabel">Score 100</span>
      <span id="streakLabel">Streak 0</span>
    </header>

    <section id="loadingPanel" class="state-panel">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loadingText">Loading…</p>
    </section>

    <section id="errorPanel" class="state-panel hidden" role="alert">
      <p id="errorText"></p>
      <button class="primary" id="retryButton" type="button">Retry</button>
    </section>

    <section id="playPanel" class="hidden">
      <div class="artwork-frame">
        <img id="artwork" alt="Artwork for the current round" />
      </div>

      <div id="answers" class="answers" aria-label="Artist choices"></div>

      <div id="feedback" class="feedback hidden" aria-live="polite">
        <div class="feedback-copy">
          <strong id="feedbackTitle"></strong>
          <span id="feedbackArtist"></span>
        </div>
        <a id="postLink" href="https://danbooru.donmai.us/" target="_blank" rel="noopener noreferrer">Source ↗</a>
      </div>
    </section>

    <section id="finishPanel" class="state-panel hidden">
      <p class="game-over">Game over</p>
      <p id="finalStats" class="final-stats"></p>
      <button class="primary" id="restartButton" type="button">Play again</button>
    </section>
  </main>

  <script>
"use strict";

const CONFIG = {
  build: "1.2.0-static-host",
  imageProxyBase: "https://corsproxy.io/",
  danbooruReferer: "https://danbooru.donmai.us/",
  apiBase: "https://danbooru.donmai.us",
  ratingTag: "yuri",
  pools: [
    { tag: "genshin_impact", label: "Genshin Impact" },
    { tag: "zenless_zone_zero", label: "Zenless Zone Zero" },
    { tag: "honkai_(series)", label: "Honkai (series)" },
  ],
  choicesPerRound: 4,
  fetchLimit: 70,
  maxRandomPage: 8,
  poolFetchAttempts: 2,
  requestTimeoutMs: 12000,
  imageTimeoutMs: 15000,

  startScore: 100,
  correctBase: 100,
  streakStep: 25,
  maxCorrectReward: 250,
  wrongPenalty: 35,

  correctAdvanceDelay: 850,
  wrongAdvanceDelay: 1400,
  gameOverDelay: 1600,
};

const state = {
  pool: [],
  availablePools: [],
  poolBag: [],
  usedIdsByPool: new Map(),
  currentRound: null,
  nextRound: null,
  nextRoundPromise: null,
  roundNumber: 0,
  score: CONFIG.startScore,
  streak: 0,
  bestStreak: 0,
  locked: false,
  advanceTimer: null,
  sessionId: 0,
  diagnostics: [],
};

const el = {
  roundLabel: document.querySelector("#roundLabel"),
  scoreLabel: document.querySelector("#scoreLabel"),
  streakLabel: document.querySelector("#streakLabel"),
  loadingPanel: document.querySelector("#loadingPanel"),
  loadingText: document.querySelector("#loadingText"),
  errorPanel: document.querySelector("#errorPanel"),
  errorText: document.querySelector("#errorText"),
  playPanel: document.querySelector("#playPanel"),
  finishPanel: document.querySelector("#finishPanel"),
  artwork: document.querySelector("#artwork"),
  answers: document.querySelector("#answers"),
  feedback: document.querySelector("#feedback"),
  feedbackTitle: document.querySelector("#feedbackTitle"),
  feedbackArtist: document.querySelector("#feedbackArtist"),
  postLink: document.querySelector("#postLink"),
  retryButton: document.querySelector("#retryButton"),
  restartButton: document.querySelector("#restartButton"),
  finalStats: document.querySelector("#finalStats"),
};

function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function displayTag(tag) {
  return String(tag).replaceAll("_", " ");
}

function errorMessage(error) {
  return error instanceof Error ? error.message : String(error);
}

function logDiagnostic(stage, detail) {
  const entry = { time: new Date().toISOString(), stage, detail };
  state.diagnostics.push(entry);
  console.info("[Artist Guessr]", stage, detail);
}

function getSingleArtist(post) {
  const artists = String(post?.tag_string_artist || "")
    .trim()
    .split(/\s+/)
    .filter(Boolean);
  return artists.length === 1 ? artists[0] : null;
}

function absoluteUrl(value) {
  return new URL(value, `${CONFIG.apiBase}/`).href;
}

function getVariant(mediaAsset, type) {
  return Array.isArray(mediaAsset?.variants)
    ? mediaAsset.variants.find((variant) => String(variant?.type) === type) || null
    : null;
}

function makeProxyUrl(targetUrl) {
  // Danbooru's CDN rejects hotlinks when the request does not carry a
  // Danbooru Referer. A normal browser page cannot forge that forbidden
  // header, but corsproxy.io can set it on its server-side origin request.
  const url = new URL(CONFIG.imageProxyBase);
  url.searchParams.set("url", targetUrl);
  url.searchParams.append("reqHeaders", `referer:${CONFIG.danbooruReferer}`);
  return url.href;
}

function expandImageCandidates(rawCandidates) {
  const result = [];
  const seen = new Set();

  for (const item of rawCandidates) {
    if (!item?.url) continue;
    const proxied = makeProxyUrl(item.url);
    if (seen.has(proxied)) continue;
    seen.add(proxied);
    result.push({ label: `corsproxy+referer:${item.label}`, url: proxied });
  }

  return result;
}

function isKnownFreeProxyOrigin() {
  const host = location.hostname.toLowerCase();
  if (location.protocol !== "https:" && host !== "localhost" && host !== "127.0.0.1") return false;
  return host === "localhost" ||
    host === "127.0.0.1" ||
    host.endsWith(".github.io") ||
    host.endsWith(".codepen.io") ||
    host.endsWith(".replit.dev") ||
    host.endsWith(".replit.app") ||
    host.endsWith(".glitch.me");
}

function normalizePost(post, sourcePool) {
  const artist = getSingleArtist(post);
  const mediaAsset = post?.media_asset;
  if (!post?.id || !artist || !mediaAsset?.id) return null;
  if (post.rating !== "g" || post.is_deleted === true) return null;

  const rawCandidates = [];
  for (const type of ["720x720", "360x360", "180x180"]) {
    const variant = getVariant(mediaAsset, type);
    if (!variant) continue;

    // Prefer the concrete CDN URL so the proxy can attach the Danbooru
    // Referer directly to the request that reaches cdn.donmai.us. Keep the
    // media-asset redirect as a secondary route.
    if (variant.url) {
      try {
        rawCandidates.push({ label: `cdn:${type}`, url: absoluteUrl(variant.url) });
      } catch {}
    }
    rawCandidates.push({
      label: `media:${type}`,
      url: `${CONFIG.apiBase}/media_assets/${mediaAsset.id}/${type}`,
    });
  }

  for (const [label, raw] of [
    ["post:preview", post.preview_file_url],
    ["post:large", post.large_file_url],
    ["post:file", post.file_url],
  ]) {
    if (!raw) continue;
    try { rawCandidates.push({ label, url: absoluteUrl(raw) }); } catch {}
  }

  const imageCandidates = expandImageCandidates(rawCandidates);
  if (imageCandidates.length === 0) return null;

  let sourceUrl = `${CONFIG.apiBase}/posts/${post.id}`;
  try {
    if (/^https?:\/\//i.test(String(post.source || ""))) {
      sourceUrl = new URL(post.source).href;
    }
  } catch {}

  return {
    id: post.id,
    artist,
    imageCandidates,
    postUrl: `${CONFIG.apiBase}/posts/${post.id}`,
    sourceUrl,
    poolTag: sourcePool.tag,
    poolLabel: sourcePool.label,
    mediaAssetId: mediaAsset.id,
  };
}

function fetchWithTimeout(url, options = {}, timeoutMs = CONFIG.requestTimeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  return fetch(url, { ...options, signal: controller.signal })
    .finally(() => clearTimeout(timer));
}

async function fetchPool(sourcePool) {
  const byId = new Map();
  const attemptNotes = [];

  for (let attempt = 0; attempt < CONFIG.poolFetchAttempts; attempt += 1) {
    const page = 1 + Math.floor(Math.random() * CONFIG.maxRandomPage);
    const params = new URLSearchParams({
      tags: `${sourcePool.tag} ${CONFIG.ratingTag}`,
      limit: String(CONFIG.fetchLimit),
      page: String(page),
      only: "id,tag_string_artist,rating,is_deleted,source,file_url,large_file_url,preview_file_url,media_asset",
    });
    const url = `${CONFIG.apiBase}/posts.json?${params.toString()}`;

    try {
      const response = await fetchWithTimeout(url, {
        mode: "cors",
        credentials: "omit",
        cache: "no-store",
        referrerPolicy: "no-referrer",
      });

      if (!response.ok) {
        if (response.status === 429) {
          throw new Error("Danbooru rate-limited the request (HTTP 429)");
        }
        throw new Error(`Danbooru returned HTTP ${response.status}`);
      }

      const json = await response.json();
      if (!Array.isArray(json)) throw new Error("unexpected API response");

      const normalized = json
        .map((post) => normalizePost(post, sourcePool))
        .filter(Boolean);

      for (const post of normalized) byId.set(post.id, post);
      attemptNotes.push(`page ${page}: ${normalized.length} usable`);
    } catch (error) {
      attemptNotes.push(`page ${page}: ${errorMessage(error)}`);
      if (attempt === CONFIG.poolFetchAttempts - 1 && byId.size === 0) {
        throw new Error(`${sourcePool.label}: ${errorMessage(error)}`);
      }
    }

    const uniqueArtists = new Set([...byId.values()].map((post) => post.artist));
    if (uniqueArtists.size >= CONFIG.choicesPerRound) break;
  }

  const posts = [...byId.values()];
  const uniqueArtists = new Set(posts.map((post) => post.artist));
  if (uniqueArtists.size < CONFIG.choicesPerRound) {
    throw new Error(`${sourcePool.label}: only ${uniqueArtists.size} usable artists found`);
  }

  logDiagnostic(
    "pool-ok",
    `${sourcePool.label}: ${posts.length} posts / ${uniqueArtists.size} artists (${attemptNotes.join("; ")})`
  );
  return posts;
}

async function fetchAllPools() {
  const allPosts = [];
  const workingPools = [];
  const failures = [];

  for (const sourcePool of CONFIG.pools) {
    el.loadingText.textContent = `Loading ${sourcePool.label}…`;
    try {
      const posts = await fetchPool(sourcePool);
      allPosts.push(...posts);
      workingPools.push(sourcePool);
    } catch (error) {
      const detail = `${sourcePool.label}: ${errorMessage(error)}`;
      failures.push(detail);
      logDiagnostic("pool-failed", detail);
    }
  }

  if (workingPools.length === 0) {
    const localHint = location.protocol === "file:"
      ? "\n\nThis browser blocked Danbooru from a local file. The HTML itself is self-contained; try opening it in another current browser, or serve this same single file from any static web host."
      : "";
    throw new Error(`Danbooru API could not be read.\n${failures.join("\n")}${localHint}`);
  }

  if (failures.length) {
    logDiagnostic(
      "degraded-mode",
      `Starting with ${workingPools.length}/${CONFIG.pools.length} pools. ${failures.join(" | ")}`
    );
  }

  return { posts: allPosts, workingPools };
}

function refillPoolBag() {
  state.poolBag = shuffle(state.availablePools.map((pool) => pool.tag));
}

function takeNextPoolTag() {
  if (state.poolBag.length === 0) refillPoolBag();
  return state.poolBag.pop();
}

function getUsedIds(poolTag) {
  if (!state.usedIdsByPool.has(poolTag)) state.usedIdsByPool.set(poolTag, new Set());
  return state.usedIdsByPool.get(poolTag);
}

function makeRound(post, postsInPool) {
  const artists = [...new Set(postsInPool.map((item) => item.artist))];
  const distractors = shuffle(artists.filter((artist) => artist !== post.artist))
    .slice(0, CONFIG.choicesPerRound - 1);
  if (distractors.length < CONFIG.choicesPerRound - 1) return null;
  return { ...post, choices: shuffle([post.artist, ...distractors]) };
}

function buildRoundForPool(poolTag) {
  const postsInPool = state.pool.filter((post) => post.poolTag === poolTag);
  const usedIds = getUsedIds(poolTag);
  let candidates = postsInPool.filter((post) => !usedIds.has(post.id));

  if (candidates.length === 0) {
    usedIds.clear();
    candidates = [...postsInPool];
  }

  const currentArtist = state.currentRound?.artist;
  const noImmediateRepeat = candidates.filter((post) => post.artist !== currentArtist);
  if (noImmediateRepeat.length > 0) candidates = noImmediateRepeat;

  for (const post of shuffle(candidates)) {
    const round = makeRound(post, postsInPool);
    if (!round) continue;
    usedIds.add(post.id);
    return round;
  }

  throw new Error(`Could not build a round from ${poolTag}.`);
}

function buildNextRound() {
  return buildRoundForPool(takeNextPoolTag());
}

async function fetchArtworkBlob(url) {
  let response;
  try {
    response = await fetchWithTimeout(url, {
      mode: "cors",
      credentials: "omit",
      cache: "default",
    }, CONFIG.imageTimeoutMs);
  } catch (error) {
    throw new Error(`proxy fetch failed: ${errorMessage(error)}`);
  }

  const contentType = response.headers.get("content-type") || "unknown";
  if (!response.ok) {
    let detail = "";
    try { detail = (await response.text()).replace(/\s+/g, " ").slice(0, 180); } catch {}
    throw new Error(`proxy HTTP ${response.status} (${contentType})${detail ? `: ${detail}` : ""}`);
  }

  const blob = await response.blob();
  if (!blob.size) throw new Error(`proxy returned an empty body (${contentType})`);
  if (blob.type && !blob.type.startsWith("image/")) {
    let detail = "";
    try { detail = (await blob.text()).replace(/\s+/g, " ").slice(0, 180); } catch {}
    throw new Error(`proxy returned ${blob.type}, not an image${detail ? `: ${detail}` : ""}`);
  }
  return URL.createObjectURL(blob);
}

function releaseRoundArtwork(round) {
  if (round?.imageUrl && String(round.imageUrl).startsWith("blob:")) {
    URL.revokeObjectURL(round.imageUrl);
  }
}

async function resolveArtwork(round) {
  let lastError = null;
  for (const candidate of round.imageCandidates) {
    try {
      const url = await fetchArtworkBlob(candidate.url);
      logDiagnostic("image-ok", `${round.poolLabel} post ${round.id}: ${candidate.label}`);
      return { ...round, imageUrl: url, imageRoute: candidate.label };
    } catch (error) {
      lastError = error;
      let host = "unknown";
      try { host = new URL(candidate.url).host; } catch {}
      logDiagnostic(
        "image-candidate-failed",
        `${round.poolLabel} post ${round.id}: ${candidate.label} (${host}) - ${errorMessage(error)}`
      );
    }
  }
  throw new Error(`all image routes failed for post ${round.id}: ${errorMessage(lastError)}`);
}

async function createPreloadedRound() {
  let lastError = null;
  const attempts = Math.max(10, state.availablePools.length * 4);

  for (let attempt = 0; attempt < attempts; attempt += 1) {
    const round = buildNextRound();
    try {
      return await resolveArtwork(round);
    } catch (error) {
      lastError = error;
      logDiagnostic("image-failed", `${round.poolLabel} post ${round.id}: ${errorMessage(error)}`);
    }
  }

  throw new Error(
    `Danbooru metadata loaded, but the hosted-page image proxy could not retrieve a usable artwork. ` +
    `Last error: ${errorMessage(lastError)}`
  );
}

function prepareNextRound(sessionId) {
  const promise = createPreloadedRound()
    .then((round) => {
      if (state.sessionId === sessionId) state.nextRound = round;
      else releaseRoundArtwork(round);
      return round;
    })
    .finally(() => {
      if (state.sessionId === sessionId && state.nextRoundPromise === promise) {
        state.nextRoundPromise = null;
      }
    });

  state.nextRoundPromise = promise;
  return promise;
}

function setVisible(panel) {
  [el.loadingPanel, el.errorPanel, el.playPanel, el.finishPanel].forEach((node) => {
    node.classList.toggle("hidden", node !== panel);
  });
}

function updateStats() {
  el.roundLabel.textContent = `Round ${state.roundNumber}`;
  el.scoreLabel.textContent = `Score ${state.score}`;
  el.streakLabel.textContent = `Streak ${state.streak}`;
}

function applyArtistLengthClass(button, artist) {
  const length = displayTag(artist).length;
  if (length >= 34) button.classList.add("very-long");
  else if (length >= 22) button.classList.add("long");
}

function renderRound() {
  const round = state.currentRound;
  if (!round) return;

  state.locked = false;
  updateStats();
  el.answers.replaceChildren();
  el.feedback.classList.add("hidden");
  el.artwork.src = round.imageUrl;
  el.postLink.href = round.sourceUrl || round.postUrl;

  round.choices.forEach((artist, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "answer";
    button.dataset.artist = artist;
    button.title = displayTag(artist);
    applyArtistLengthClass(button, artist);

    const key = document.createElement("span");
    key.className = "answer-key";
    key.textContent = String(index + 1);

    const label = document.createElement("span");
    label.className = "answer-label";
    label.textContent = displayTag(artist);

    button.append(key, label);
    button.addEventListener("click", () => answerRound(artist, button));
    el.answers.append(button);
  });

  if (!state.nextRound && !state.nextRoundPromise) {
    prepareNextRound(state.sessionId).catch((error) => {
      logDiagnostic("preload-next-failed", errorMessage(error));
    });
  }
}

function correctRewardForStreak(streak) {
  return Math.min(
    CONFIG.correctBase + Math.max(0, streak - 1) * CONFIG.streakStep,
    CONFIG.maxCorrectReward
  );
}

function answerRound(selectedArtist, selectedButton) {
  if (state.locked || !state.currentRound) return;
  state.locked = true;

  const round = state.currentRound;
  const correct = selectedArtist === round.artist;
  let scoreDelta;

  if (correct) {
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    scoreDelta = correctRewardForStreak(state.streak);
    state.score += scoreDelta;
  } else {
    state.streak = 0;
    scoreDelta = -CONFIG.wrongPenalty;
    state.score = Math.max(0, state.score + scoreDelta);
  }

  updateStats();

  for (const button of el.answers.querySelectorAll(".answer")) {
    button.disabled = true;
    if (button.dataset.artist === round.artist) button.classList.add("correct");
  }
  if (!correct) selectedButton.classList.add("wrong");

  el.feedbackTitle.textContent = correct ? `Correct +${scoreDelta}` : `Wrong ${scoreDelta}`;
  el.feedbackArtist.textContent = displayTag(round.artist);
  el.feedback.classList.remove("hidden");

  const gameOver = state.score <= 0;
  const delay = gameOver
    ? CONFIG.gameOverDelay
    : correct
      ? CONFIG.correctAdvanceDelay
      : CONFIG.wrongAdvanceDelay;

  clearTimeout(state.advanceTimer);
  state.advanceTimer = setTimeout(() => {
    if (gameOver) finishGame();
    else advanceRound();
  }, delay);
}

async function advanceRound() {
  if (!state.locked) return;

  try {
    let next = state.nextRound;
    if (!next && state.nextRoundPromise) next = await state.nextRoundPromise;
    if (!next) next = await createPreloadedRound();

    state.nextRound = null;
    const previous = state.currentRound;
    state.currentRound = next;
    state.roundNumber += 1;
    renderRound();
    releaseRoundArtwork(previous);
  } catch (error) {
    showError(error);
  }
}

function finishGame() {
  clearTimeout(state.advanceTimer);
  state.locked = true;
  el.finalStats.textContent = `Rounds survived: ${state.roundNumber} · Best streak: ${state.bestStreak}`;
  setVisible(el.finishPanel);
}

function diagnosticReport(error) {
  return [
    `Artist Guessr ${CONFIG.build}`,
    `Error: ${errorMessage(error)}`,
    `Page protocol: ${location.protocol}`,
    `Page origin: ${location.origin}`,
    `Online: ${String(navigator.onLine)}`,
    `Working pools: ${state.availablePools.map((pool) => pool.label).join(", ") || "none"}`,
    `Image strategy: corsproxy.io with forced Danbooru Referer, fetched as Blob`,
    `Known free proxy origin: ${String(isKnownFreeProxyOrigin())}`,
    "",
    "Diagnostics:",
    ...state.diagnostics.map((item) => `${item.time} | ${item.stage} | ${item.detail}`),
  ].join("\n");
}

function showError(error) {
  clearTimeout(state.advanceTimer);
  state.locked = true;
  console.error(error);
  el.errorText.textContent = diagnosticReport(error);
  setVisible(el.errorPanel);
}

function resetState() {
  clearTimeout(state.advanceTimer);
  releaseRoundArtwork(state.currentRound);
  releaseRoundArtwork(state.nextRound);
  state.sessionId += 1;
  state.pool = [];
  state.availablePools = [];
  state.poolBag = [];
  state.usedIdsByPool = new Map();
  state.currentRound = null;
  state.nextRound = null;
  state.nextRoundPromise = null;
  state.roundNumber = 0;
  state.score = CONFIG.startScore;
  state.streak = 0;
  state.bestStreak = 0;
  state.locked = true;
  state.diagnostics = [];
  logDiagnostic("environment", `protocol=${location.protocol}; origin=${location.origin}; online=${navigator.onLine}`);
}

async function startGame() {
  resetState();
  const sessionId = state.sessionId;

  el.roundLabel.textContent = "Round —";
  el.scoreLabel.textContent = `Score ${CONFIG.startScore}`;
  el.streakLabel.textContent = "Streak 0";
  el.loadingText.textContent = "Loading Danbooru metadata…";
  setVisible(el.loadingPanel);

  try {
    if (location.protocol === "file:") {
      throw new Error(
        "Live mode cannot run by double-clicking this file. corsproxy.io does not accept file:// as a free browser origin. " +
        "Upload this exact single file as index.html to GitHub Pages, then open the https://...github.io/... address."
      );
    }

    if (!isKnownFreeProxyOrigin()) {
      logDiagnostic(
        "origin-warning",
        `Origin ${location.origin} is not in the built-in free-origin check. GitHub Pages (*.github.io) is recommended.`
      );
    }

    const result = await fetchAllPools();
    if (state.sessionId !== sessionId) return;

    state.pool = result.posts;
    state.availablePools = result.workingPools;
    state.currentRound = await createPreloadedRound();
    if (state.sessionId !== sessionId) return;

    state.roundNumber = 1;
    setVisible(el.playPanel);
    renderRound();
  } catch (error) {
    if (state.sessionId === sessionId) showError(error);
  }
}

function handleKeyboard(event) {
  if (event.repeat || state.locked || el.playPanel.classList.contains("hidden")) return;
  const index = Number(event.key) - 1;
  if (!Number.isInteger(index) || index < 0 || index >= CONFIG.choicesPerRound) return;
  const button = el.answers.querySelectorAll(".answer")[index];
  if (button && !button.disabled) button.click();
}

el.retryButton.addEventListener("click", startGame);
el.restartButton.addEventListener("click", startGame);
document.addEventListener("keydown", handleKeyboard);
window.__ARTIST_GUESSR_BUILD__ = CONFIG.build;
startGame();
  </script>
</body>
</html>
