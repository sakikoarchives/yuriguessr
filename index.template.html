<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Artist Guessr</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f5f7;
      background: #101114;
      font-synthesis: none;
      --surface: #191b20;
      --surface-hover: #22252b;
      --line: #31343b;
      --muted: #9b9fa9;
      --good: #59c995;
      --bad: #e86d78;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #101114; }
    body { min-height: 100vh; }
    button, a { font: inherit; }
    button { cursor: pointer; }
    .game { width: min(780px, 100%); margin: 0 auto; padding: 10px; }
    .hud {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      min-height: 32px; margin-bottom: 8px; color: var(--muted);
      font-size: .84rem; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .hud span:nth-child(2) { color: #f5f5f7; font-size: .92rem; }
    .hud span:last-child { text-align: right; }
    .artwork-frame {
      display: grid; place-items: center; width: 100%;
      border-radius: 8px; background: #08090b;
    }
    /* Intrinsic dimensions, rather than a fixed-height clipped viewport. */
    .artwork-frame img {
      display: block; width: auto; height: auto; max-width: 100%;
      max-height: min(82vh, 900px); max-height: min(82svh, 900px);
      object-fit: contain; object-position: center;
      border-radius: 8px;
    }
    .answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 8px; }
    .answer, .primary { border: 1px solid var(--line); border-radius: 7px; font-weight: 700; }
    .answer {
      position: relative; display: flex; align-items: center; justify-content: center;
      min-height: 47px; padding: 9px 34px 9px 12px; background: var(--surface);
      color: #f5f5f7; line-height: 1.15;
      transition: background 100ms ease, border-color 100ms ease, transform 80ms ease;
    }
    .answer:hover:not(:disabled) { background: var(--surface-hover); }
    .answer:active:not(:disabled) { transform: scale(.995); }
    .answer:disabled { cursor: default; }
    .answer-label { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
    .answer.long { font-size: .88rem; }
    .answer.very-long { font-size: .76rem; }
    .answer-key { position: absolute; right: 10px; color: #696e78; font-size: .72rem; font-weight: 800; }
    .answer.correct { border-color: var(--good); background: #173326; }
    .answer.wrong { border-color: var(--bad); background: #351a1e; }
    .feedback {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      min-height: 38px; margin-top: 8px; padding: 7px 9px; border: 1px solid var(--line);
      border-radius: 7px; color: var(--muted); font-size: .84rem;
    }
    .feedback-copy { min-width: 0; overflow-wrap: anywhere; }
    .feedback strong { color: #f5f5f7; margin-right: 6px; }
    .feedback a { flex: 0 0 auto; color: var(--muted); text-decoration: none; }
    .feedback a:hover { color: #fff; }
    .primary { padding: 8px 13px; background: #f3f3f5; color: #111216; }
    .state-panel {
      min-height: min(76vh, 620px); display: grid; place-content: center; justify-items: center;
      gap: 12px; padding: 24px; text-align: center; color: var(--muted);
    }
    .state-panel p { margin: 0; max-width: 580px; line-height: 1.5; }
    .spinner { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: #d9dbe1; border-radius: 50%; animation: spin .8s linear infinite; }
    .game-over { color: #fff; font-size: clamp(2.1rem, 9vw, 3.8rem); font-weight: 800; letter-spacing: -.05em; }
    .final-stats { color: var(--muted); font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 560px) {
      .game { padding: 7px; }
      .artwork-frame img { max-height: min(75vh, 800px); max-height: min(75svh, 800px); }
      .answers { grid-template-columns: 1fr; }
      .answer { min-height: 43px; }
      .feedback { align-items: flex-start; }
    }
    #errorText { white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: .75rem; }
  </style>
</head>
<body>
  <main class="game">
    <header class="hud" aria-label="Game stats">
      <span id="roundLabel">Round —</span>
      <span id="scoreLabel">Score 100</span>
      <span id="streakLabel">Streak 0</span>
    </header>

    <section id="loadingPanel" class="state-panel">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading artwork…</p>
    </section>

    <section id="errorPanel" class="state-panel hidden" role="alert">
      <p id="errorText"></p>
      <button class="primary" id="retryButton" type="button">Retry</button>
    </section>

    <section id="playPanel" class="hidden">
      <div class="artwork-frame"><img id="artwork" alt="Artwork for the current round" decoding="async" /></div>
      <div id="answers" class="answers" aria-label="Artist choices"></div>
      <div id="feedback" class="feedback hidden" aria-live="polite">
        <div class="feedback-copy"><strong id="feedbackTitle"></strong><span id="feedbackArtist"></span></div>
        <a id="postLink" href="#" target="_blank" rel="noopener noreferrer">Source ↗</a>
      </div>
    </section>

    <section id="finishPanel" class="state-panel hidden">
      <p id="finishTitle" class="game-over">Game over</p>
      <p id="finalStats" class="final-stats"></p>
      <button class="primary" id="restartButton" type="button">Play again</button>
    </section>
  </main>

  <script>
    "use strict";

    const GAME_DATA = __GAME_DATA__;
    const BUILD_META = __BUILD_META__;

    const CONFIG = {
      build: "1.5.0-unique-artwork",
      choicesPerRound: 4,
      startScore: 100,
      correctBase: 100,
      streakStep: 25,
      maxCorrectReward: 250,
      wrongPenalty: 35,
      correctAdvanceDelay: 850,
      wrongAdvanceDelay: 1400,
      gameOverDelay: 1600,
    };

    const SEEN_STORAGE_KEY = "yuriguessr-seen-artworks-v1";

    class NoMoreArtworksError extends Error {
      constructor() { super("All artworks in this snapshot have been seen."); }
    }

    const state = {
      pool: [], poolByTag: new Map(), availablePools: [], poolBag: [],
      // A globally unique history also protects against cross-tagged posts.
      seenIds: new Set(), reservedIds: new Set(), failedIds: new Set(),
      currentRound: null, nextRound: null, nextRoundPromise: null,
      roundNumber: 0, score: CONFIG.startScore, streak: 0, bestStreak: 0,
      locked: true, advanceTimer: null, sessionId: 0, replayOnRestart: false,
    };

    const el = {
      roundLabel: document.querySelector("#roundLabel"), scoreLabel: document.querySelector("#scoreLabel"),
      streakLabel: document.querySelector("#streakLabel"), loadingPanel: document.querySelector("#loadingPanel"),
      errorPanel: document.querySelector("#errorPanel"), errorText: document.querySelector("#errorText"),
      playPanel: document.querySelector("#playPanel"), finishPanel: document.querySelector("#finishPanel"),
      artwork: document.querySelector("#artwork"), answers: document.querySelector("#answers"),
      feedback: document.querySelector("#feedback"), feedbackTitle: document.querySelector("#feedbackTitle"),
      feedbackArtist: document.querySelector("#feedbackArtist"), postLink: document.querySelector("#postLink"),
      retryButton: document.querySelector("#retryButton"), restartButton: document.querySelector("#restartButton"),
      finalStats: document.querySelector("#finalStats"), finishTitle: document.querySelector("#finishTitle"),
    };

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function displayTag(tag) { return String(tag).replaceAll("_", " "); }
    function errorMessage(error) { return error instanceof Error ? error.message : String(error); }

    // Store post IDs, not artwork bytes. Read/write failures (private browsing or
    // storage quotas) never prevent playing; the in-memory set still works.
    function loadSeenHistory() {
      try {
        const saved = JSON.parse(localStorage.getItem(SEEN_STORAGE_KEY) || "[]");
        if (!Array.isArray(saved)) return new Set();
        return new Set(saved.filter((id) => Number.isSafeInteger(id) && id > 0));
      } catch (error) {
        console.warn("Could not read artwork history", error);
        return new Set();
      }
    }

    function saveSeenHistory() {
      try {
        // Merge another open tab's recent progress before saving.
        for (const id of loadSeenHistory()) state.seenIds.add(id);
        localStorage.setItem(SEEN_STORAGE_KEY, JSON.stringify([...state.seenIds]));
      } catch (error) { console.warn("Could not save artwork history", error); }
    }

    function forgetSeenHistory() {
      state.seenIds.clear();
      try { localStorage.removeItem(SEEN_STORAGE_KEY); }
      catch (error) { console.warn("Could not reset artwork history", error); }
    }

    function setVisible(panel) {
      [el.loadingPanel, el.errorPanel, el.playPanel, el.finishPanel].forEach((node) => {
        node.classList.toggle("hidden", node !== panel);
      });
    }

    function updateStats() {
      el.roundLabel.textContent = `Round ${state.roundNumber}`;
      el.scoreLabel.textContent = `Score ${state.score}`;
      el.streakLabel.textContent = `Streak ${state.streak}`;
    }

    function validateData() {
      if (!Array.isArray(GAME_DATA) || GAME_DATA.length === 0) throw new Error("No built-in game data was found.");
      const grouped = new Map();
      const uniqueIds = new Set();
      for (const item of GAME_DATA) {
        if (!Number.isSafeInteger(item?.id) || !item.artist || !item.imageData || !item.poolTag) continue;
        if (uniqueIds.has(item.id)) continue;
        uniqueIds.add(item.id);
        if (!grouped.has(item.poolTag)) grouped.set(item.poolTag, []);
        grouped.get(item.poolTag).push(item);
      }
      if (grouped.size === 0) throw new Error("The built data contains no usable artworks.");
      for (const [poolTag, items] of grouped) {
        const artists = new Set(items.map((item) => item.artist));
        if (artists.size < CONFIG.choicesPerRound) {
          throw new Error(`${poolTag} contains only ${artists.size} unique artists; ${CONFIG.choicesPerRound} are required.`);
        }
      }
      state.poolByTag = grouped;
      return [...grouped.keys()];
    }

    function isUnused(post) {
      return !state.seenIds.has(post.id) && !state.reservedIds.has(post.id) && !state.failedIds.has(post.id);
    }

    function remainingPosts(poolTag) { return (state.poolByTag.get(poolTag) || []).filter(isUnused); }

    function takeNextPoolTag() {
      const eligible = state.availablePools.filter((tag) => remainingPosts(tag).length);
      if (!eligible.length) return null;
      // Skip empty pools without prematurely refilling or repeating any post.
      while (state.poolBag.length) {
        const tag = state.poolBag.pop();
        if (eligible.includes(tag)) return tag;
      }
      state.poolBag = shuffle(eligible);
      return state.poolBag.pop();
    }

    function makeRound(post, postsInPool) {
      const artists = [...new Set(postsInPool.map((item) => item.artist))];
      const distractors = shuffle(artists.filter((artist) => artist !== post.artist)).slice(0, CONFIG.choicesPerRound - 1);
      if (distractors.length < CONFIG.choicesPerRound - 1) return null;
      return { ...post, choices: shuffle([post.artist, ...distractors]) };
    }

    function buildNextRound() {
      const poolTag = takeNextPoolTag();
      if (!poolTag) return null;
      const postsInPool = state.poolByTag.get(poolTag);
      let candidates = remainingPosts(poolTag);
      const currentArtist = state.currentRound?.artist;
      const noImmediateRepeat = candidates.filter((post) => post.artist !== currentArtist);
      if (noImmediateRepeat.length) candidates = noImmediateRepeat;
      for (const post of shuffle(candidates)) {
        const round = makeRound(post, postsInPool);
        if (!round) continue;
        state.reservedIds.add(post.id); // A preloaded round cannot be selected again.
        return round;
      }
      throw new Error(`Could not build a round from ${poolTag}.`);
    }

    function preloadRound(round) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const timer = setTimeout(() => reject(new Error(`Embedded artwork timed out for post ${round.id}.`)), 12000);
        img.onload = () => { clearTimeout(timer); resolve(round); };
        img.onerror = () => { clearTimeout(timer); reject(new Error(`Embedded artwork failed for post ${round.id}.`)); };
        img.src = round.imageData;
      });
    }

    async function createPreloadedRound(sessionId) {
      let lastError = null;
      // Exhaust all remaining candidates rather than retrying an already seen ID.
      while (state.sessionId === sessionId) {
        const round = buildNextRound();
        if (!round) {
          if (lastError) throw lastError;
          throw new NoMoreArtworksError();
        }
        const reservations = state.reservedIds;
        const failures = state.failedIds;
        try {
          await preloadRound(round);
          if (state.sessionId !== sessionId) return null;
          return round;
        } catch (error) {
          reservations.delete(round.id);
          if (state.sessionId !== sessionId) return null;
          failures.add(round.id);
          lastError = error;
        }
      }
      return null;
    }

    function prepareNextRound(sessionId) {
      const promise = createPreloadedRound(sessionId).then((round) => {
        if (state.sessionId === sessionId) state.nextRound = round;
        return round;
      }).finally(() => {
        if (state.sessionId === sessionId && state.nextRoundPromise === promise) state.nextRoundPromise = null;
      });
      state.nextRoundPromise = promise;
      return promise;
    }

    function applyArtistLengthClass(button, artist) {
      const length = displayTag(artist).length;
      if (length >= 34) button.classList.add("very-long");
      else if (length >= 22) button.classList.add("long");
    }

    function renderRound() {
      const round = state.currentRound;
      if (!round) return;
      // Mark an artwork as seen when it is actually displayed, not when queued.
      state.reservedIds.delete(round.id);
      state.seenIds.add(round.id);
      saveSeenHistory();
      state.locked = false;
      updateStats();
      el.answers.replaceChildren();
      el.feedback.classList.add("hidden");
      el.artwork.src = round.imageData;
      el.postLink.href = round.sourceUrl || round.postUrl;

      round.choices.forEach((artist, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.dataset.artist = artist;
        button.title = displayTag(artist);
        applyArtistLengthClass(button, artist);
        const label = document.createElement("span");
        label.className = "answer-label";
        label.textContent = displayTag(artist);
        const key = document.createElement("span");
        key.className = "answer-key";
        key.textContent = String(index + 1);
        button.append(label, key);
        button.addEventListener("click", () => answerRound(artist, button));
        el.answers.append(button);
      });

      if (!state.nextRound && !state.nextRoundPromise) {
        prepareNextRound(state.sessionId).catch((error) => {
          if (!(error instanceof NoMoreArtworksError)) console.warn(error);
        });
      }
    }

    function correctRewardForStreak(streak) {
      return Math.min(CONFIG.correctBase + Math.max(0, streak - 1) * CONFIG.streakStep, CONFIG.maxCorrectReward);
    }

    function answerRound(selectedArtist, selectedButton) {
      if (state.locked || !state.currentRound) return;
      state.locked = true;
      const round = state.currentRound;
      const correct = selectedArtist === round.artist;
      let scoreDelta;
      if (correct) {
        state.streak += 1;
        state.bestStreak = Math.max(state.bestStreak, state.streak);
        scoreDelta = correctRewardForStreak(state.streak);
        state.score += scoreDelta;
      } else {
        state.streak = 0;
        scoreDelta = -CONFIG.wrongPenalty;
        state.score = Math.max(0, state.score + scoreDelta);
      }
      updateStats();
      for (const button of el.answers.querySelectorAll(".answer")) {
        button.disabled = true;
        if (button.dataset.artist === round.artist) button.classList.add("correct");
      }
      if (!correct) selectedButton.classList.add("wrong");
      el.feedbackTitle.textContent = correct ? `Correct +${scoreDelta}` : `Wrong ${scoreDelta}`;
      el.feedbackArtist.textContent = displayTag(round.artist);
      el.feedback.classList.remove("hidden");
      const gameOver = state.score <= 0;
      const delay = gameOver ? CONFIG.gameOverDelay : correct ? CONFIG.correctAdvanceDelay : CONFIG.wrongAdvanceDelay;
      clearTimeout(state.advanceTimer);
      state.advanceTimer = setTimeout(() => gameOver ? finishGame() : advanceRound(), delay);
    }

    async function advanceRound() {
      if (!state.locked) return;
      const sessionId = state.sessionId;
      try {
        let next = state.nextRound;
        if (!next && state.nextRoundPromise) next = await state.nextRoundPromise;
        if (!next) next = await createPreloadedRound(sessionId);
        if (state.sessionId !== sessionId) return;
        if (!next) return;
        state.nextRound = null;
        state.currentRound = next;
        state.roundNumber += 1;
        renderRound();
      } catch (error) {
        if (state.sessionId !== sessionId) return;
        if (error instanceof NoMoreArtworksError) finishGame(true);
        else showError(error);
      }
    }

    function finishGame(exhausted = false) {
      clearTimeout(state.advanceTimer);
      state.locked = true;
      state.replayOnRestart = exhausted;
      el.finishTitle.textContent = exhausted ? "All artworks seen!" : "Game over";
      el.finalStats.textContent = exhausted
        ? `You've seen every available artwork in this snapshot (${state.pool.length}). Check back after the next update for a refreshed selection. · Best streak: ${state.bestStreak}`
        : `Rounds survived: ${state.roundNumber} · Best streak: ${state.bestStreak}`;
      el.restartButton.textContent = exhausted ? "Replay this collection" : "Play again";
      setVisible(el.finishPanel);
    }

    function showError(error) {
      clearTimeout(state.advanceTimer);
      state.locked = true;
      console.error(error);
      el.errorText.textContent = [
        `Artist Guessr ${CONFIG.build}`,
        `Error: ${errorMessage(error)}`,
        `Snapshot: ${BUILD_META?.builtAt || "unknown"}`,
        `Artworks: ${Array.isArray(GAME_DATA) ? GAME_DATA.length : 0}`,
      ].join("\n");
      setVisible(el.errorPanel);
    }

    async function startGame() {
      clearTimeout(state.advanceTimer);
      state.sessionId += 1;
      const sessionId = state.sessionId;
      state.pool = Array.isArray(GAME_DATA) ? GAME_DATA : [];
      state.poolBag = [];
      state.poolByTag = new Map();
      state.seenIds = new Set([...state.seenIds, ...loadSeenHistory()]);
      state.reservedIds = new Set();
      state.failedIds = new Set();
      state.replayOnRestart = false;
      state.currentRound = null;
      state.nextRound = null;
      state.nextRoundPromise = null;
      state.roundNumber = 0;
      state.score = CONFIG.startScore;
      state.streak = 0;
      state.bestStreak = 0;
      state.locked = true;
      el.roundLabel.textContent = "Round —";
      el.scoreLabel.textContent = `Score ${CONFIG.startScore}`;
      el.streakLabel.textContent = "Streak 0";
      setVisible(el.loadingPanel);
      try {
        state.availablePools = validateData();
        state.currentRound = await createPreloadedRound(sessionId);
        if (state.sessionId !== sessionId) return;
        state.roundNumber = 1;
        setVisible(el.playPanel);
        renderRound();
      } catch (error) {
        if (state.sessionId !== sessionId) return;
        if (error instanceof NoMoreArtworksError) finishGame(true);
        else showError(error);
      }
    }

    function handleKeyboard(event) {
      if (event.repeat || state.locked || el.playPanel.classList.contains("hidden")) return;
      const index = Number(event.key) - 1;
      if (!Number.isInteger(index) || index < 0 || index >= CONFIG.choicesPerRound) return;
      const button = el.answers.querySelectorAll(".answer")[index];
      if (button && !button.disabled) button.click();
    }

    el.retryButton.addEventListener("click", startGame);
    el.restartButton.addEventListener("click", () => {
      if (state.replayOnRestart) forgetSeenHistory();
      startGame();
    });
    document.addEventListener("keydown", handleKeyboard);
    window.__ARTIST_GUESSR_BUILD__ = CONFIG.build;
    startGame();
  </script>
</body>
</html>
