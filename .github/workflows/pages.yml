name: Build and deploy Artist Guessr

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Build fresh Danbooru snapshot
        env:
          TARGET_PER_POOL: "18"
          MAX_SOURCE_IMAGE_BYTES: "25000000"
          MAX_EMBED_IMAGE_BYTES: "750000"
          MAX_IMAGE_DIM: "1200"
          WEBP_QUALITY: "84"
        run: python tools/build_game.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

